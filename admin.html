<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="adm">
<h1 class="disp" style="font-size:3rem;margin-bottom:24px">Admin</h1>
<p id="msg" class="muted"></p>
<form id="lf" hidden>
  <input id="em" type="email" placeholder="Email admin" required>
  <input id="pw" type="password" placeholder="Password" required>
  <button>Masuk</button>
</form>
<div id="panel" hidden>
  <select id="cat"></select>
  <input id="ti" placeholder="Judul (untuk pengalaman: tulis teksnya di sini)">
  <textarea id="de" rows="2" placeholder="Deskripsi (opsional)"></textarea>
  <input id="fi" type="file">
  <button id="up">Unggah karya</button>
  <h3 style="margin:30px 0 8px">Karya tersimpan</h3><div id="list"></div>
  <button id="out" style="background:#26241f;margin-top:24px">Keluar</button>
</div>
<p><a href="index.html">← Kembali ke portofolio</a></p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="js/config.js"></script><script src="js/data.js"></script><script src="js/db.js"></script><script src="js/admin.js"></script>
</body></html>
